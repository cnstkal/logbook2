<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>logbook.zip</title>
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');
:root{
  --p:#6C4CF1; --p-d:#5636D6; --p-soft:#F1EDFF;
  --bg:#FAF9FC; --surface:#FFFFFF; --ink:#1B1523; --ink2:#75718A; --ink3:#B3AFC4;
  --line:#EFEDF5; --mint:#17B587; --mint-soft:#E4F9F1; --amber:#FFB020; --red:#F14C6C; --red-soft:#FFE9EE;
  --cat:#3D8BFF; --cat-soft:#EAF3FF;
  --r-lg:24px; --r-md:16px; --r-sm:12px; --r-pill:999px;
  --shadow:0 2px 8px rgba(30,20,60,.05), 0 12px 30px rgba(30,20,60,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{touch-action:manipulation;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Pretendard',sans-serif;-webkit-font-smoothing:antialiased;}
.app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:96px;}

/* ---- Header ---- */
.topbar{position:static;z-index:30;background:var(--bg);padding:18px 20px 10px;}
.topbar-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.logo{display:flex;align-items:center;gap:9px;font-size:25px;font-weight:800;letter-spacing:-.03em;}
.logo .dot{width:12px;height:12px;border-radius:50%;background:linear-gradient(135deg,var(--p),#A78BFA);flex-shrink:0;}
.icon-btn{width:38px;height:38px;border-radius:50%;border:none;background:var(--surface);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink2);position:relative;}
.icon-btn.on{background:var(--ink);color:#fff;}
#adminBtn{display:none;}
.icon-btn svg{width:18px;height:18px;}
.hdr-sub{font-size:13px;color:var(--ink2);line-height:1.5;margin:0 0 16px;}

.search-shell{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:var(--r-pill);padding:4px 26px 4px 18px;box-shadow:var(--shadow);}
.search-shell svg{flex-shrink:0;color:var(--ink3);}
.search-shell input{flex:1;border:none;outline:none;background:transparent;font:inherit;font-size:14.5px;color:var(--ink);padding:12px 0;}
.search-shell input::placeholder{color:var(--ink3);}
.search-shell .go{flex-shrink:0;width:38px;height:38px;border-radius:50%;border:none;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.search-shell .go svg{width:16px;height:16px;color:#fff;}

.chip-row{display:flex;gap:8px;overflow-x:auto;padding:14px 2px 4px;scrollbar-width:none;}
.chip-row::-webkit-scrollbar{display:none;}
.chip-row.wrap{flex-wrap:wrap;overflow:visible;}
.chip{flex-shrink:0;padding:8px 15px;border-radius:var(--r-pill);border:none;background:var(--surface);color:var(--ink2);font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:0 1px 3px rgba(30,20,60,.04);}
#sortRow.chip-row{gap:6px;}
#sortRow .chip{padding:5px 11px;font-size:11px;font-weight:600;box-shadow:none;background:var(--bg);}
#sortRow .chip.active{background:var(--ink);color:#fff;}
.chip.active{background:var(--ink);color:#fff;}
.chip.member.active{background:var(--p);color:#fff;}
.chip-empty{font-size:12.5px;color:var(--ink3);padding:8px 4px;}

.panel{background:var(--surface);border-radius:var(--r-lg);margin:12px 20px 0;box-shadow:var(--shadow);overflow:hidden;max-height:0;transition:max-height .25s ease;}
.panel.open{max-height:900px;}
.panel-inner{padding:18px 18px 4px;}
.panel-block{margin-bottom:16px;}
.panel-label{font-size:11.5px;font-weight:800;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em;margin-bottom:9px;}

/* ---- Content ---- */
.content{padding:16px 20px 0;}

/* ---- Add box ---- */
.add-card{border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--shadow);margin-bottom:18px;overflow:hidden;display:none;border:2px solid var(--p);}
.add-head{display:flex;align-items:center;gap:10px;padding:17px 18px;cursor:pointer;font-weight:800;font-size:15.5px;color:var(--p-d);background:var(--p-soft);}
.add-head .plus{width:26px;height:26px;border-radius:9px;background:#fff;color:var(--p);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;transition:transform .2s;flex-shrink:0;}
.add-head.open .plus{transform:rotate(45deg);}
.toggle-head{display:flex;align-items:center;gap:6px;padding:9px 4px;cursor:pointer;font-size:12.5px;font-weight:800;color:var(--ink2);}
.toggle-head .chev{transition:transform .2s;display:inline-block;font-size:11px;}
.toggle-head.open .chev{transform:rotate(180deg);}
.toggle-panel{max-height:0;overflow:hidden;transition:max-height .25s ease;}
.toggle-panel.open{max-height:600px;}
.add-body{display:none;padding:2px 18px 18px;}
.add-body.open{display:block;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:12px;font-weight:800;color:var(--ink2);margin-bottom:8px;}
.field input{width:100%;padding:12px 14px;border:1.5px solid var(--line);background:var(--bg);border-radius:var(--r-sm);font-size:14px;font-family:inherit;color:var(--ink);outline:none;transition:border-color .15s;}
.field input:focus{border-color:var(--p);background:var(--surface);}
.field input+input{margin-top:6px;}
.field-hint{font-size:11.5px;color:var(--ink3);margin-top:6px;}
.tag-input-row{display:flex;gap:8px;}
.tag-input-row input{flex:1;}
.tag-input-row button{flex-shrink:0;padding:0 16px;border-radius:var(--r-sm);border:none;background:var(--p-soft);color:var(--p);font-size:13px;font-weight:800;font-family:inherit;cursor:pointer;}
.tag-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
.tag-pill{display:inline-flex;align-items:center;gap:6px;padding:6px 6px 6px 12px;border-radius:var(--r-pill);background:var(--p-soft);color:var(--p);font-size:12px;font-weight:700;}
.tag-pill button{background:none;border:none;color:inherit;opacity:.6;cursor:pointer;font-size:11px;padding:2px;}
.picker-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.picker-head label{margin-bottom:0;}
.mini-btn{border:none;background:var(--bg);color:var(--ink2);font-size:11px;font-weight:800;padding:6px 11px;border-radius:var(--r-pill);cursor:pointer;font-family:inherit;}
.mini-btn.active{background:var(--mint);color:#fff;}
.pick-grid{display:flex;flex-wrap:wrap;gap:8px;}
.pick-btn{padding:9px 15px;border-radius:var(--r-pill);border:1.5px solid var(--line);background:var(--surface);color:var(--ink2);font-size:12.5px;font-weight:700;font-family:inherit;cursor:pointer;}
.pick-btn.picked{background:var(--mint);border-color:var(--mint);color:#fff;}
.pick-btn.cat.picked{background:var(--cat);border-color:var(--cat);color:#fff;}
.add-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:4px;}
.btn-ghost{padding:11px 17px;border-radius:var(--r-pill);border:none;background:var(--bg);color:var(--ink2);font-size:12.5px;font-weight:800;font-family:inherit;cursor:pointer;}
.btn-solid{padding:11px 20px;border-radius:var(--r-pill);border:none;background:var(--p);color:#fff;font-size:12.5px;font-weight:800;font-family:inherit;cursor:pointer;box-shadow:0 6px 16px rgba(108,76,241,.35);}
.btn-solid:disabled{opacity:.5;}
.btn-danger{padding:11px 17px;border-radius:var(--r-pill);border:none;background:var(--red-soft);color:var(--red);font-size:12.5px;font-weight:800;font-family:inherit;cursor:pointer;}

/* ---- Video card ---- */
.card{border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden;}
.thumb{position:relative;aspect-ratio:16/9;background:#111;overflow:hidden;}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;}
.thumb .cats{position:absolute;top:10px;left:10px;display:flex;gap:5px;flex-wrap:wrap;}
.cat-badge{display:inline-flex;align-items:center;gap:4px;padding:5px 11px;border-radius:var(--r-pill);background:rgba(255,255,255,.92);color:var(--cat);font-size:10.5px;font-weight:800;backdrop-filter:blur(4px);}
.cat-badge::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--cat);}
.thumb a.play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(to top,rgba(0,0,0,.45),transparent 50%);}
.thumb .play svg{width:46px;height:46px;filter:drop-shadow(0 3px 8px rgba(0,0,0,.3));}
.card-body{padding:16px 18px 18px;}
.card-title{font-size:15.5px;font-weight:800;margin:0 0 6px;line-height:1.4;}
.card-title a{color:var(--ink);text-decoration:none;}
.card-meta{font-size:11.5px;color:var(--ink3);font-weight:600;margin-bottom:12px;}
.sec{padding-top:12px;margin-top:12px;border-top:1px solid var(--line);}
.sec-label{font-size:10.5px;font-weight:800;letter-spacing:.04em;color:var(--ink3);text-transform:uppercase;margin-bottom:9px;}
.sec-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;}
.row-flex{display:flex;flex-wrap:wrap;gap:6px;}
.member-badge{display:inline-flex;padding:6px 13px;border-radius:var(--r-pill);background:var(--p-soft);color:var(--p);font-size:12px;font-weight:700;}
.sched-pill{display:inline-flex;align-items:center;gap:6px;padding:6px 13px;border-radius:var(--r-pill);background:var(--bg);color:var(--ink);font-size:12px;font-weight:700;border:1px solid var(--line);}
.sched-pill.editing{padding:5px 5px 5px 12px;}
.sched-pill.match{background:var(--amber);color:#fff;border-color:var(--amber);}
.sched-pill mark{background:#FFE49C;color:var(--ink);border-radius:3px;padding:0 2px;}
.sched-pill button{background:none;border:none;color:inherit;opacity:.55;cursor:pointer;font-size:10.5px;padding:2px;}
.add-sched{display:flex;gap:8px;margin-top:10px;}
.add-sched input{flex:1;border:1.5px solid var(--line);border-radius:var(--r-sm);color:var(--ink);font-family:inherit;font-size:13px;padding:10px 12px;outline:none;background:var(--bg);}
.add-sched button{background:var(--ink);border:none;color:#fff;border-radius:var(--r-sm);padding:10px 15px;font-size:12.5px;font-weight:800;cursor:pointer;font-family:inherit;}
.empty-txt{color:var(--ink3);font-size:12.5px;}
.card-actions{display:flex;gap:8px;margin-top:14px;}
.card-actions button{flex:1;border:none;padding:10px;border-radius:var(--r-sm);font-size:12px;font-weight:800;font-family:inherit;cursor:pointer;background:var(--bg);color:var(--ink2);}
.card-actions button.primary{background:var(--p);color:#fff;}
.card-actions button.danger{background:var(--red-soft);color:var(--red);}
.title-edit{width:100%;padding:10px 12px;border:1.5px solid var(--p);border-radius:var(--r-sm);font-size:14px;font-family:inherit;margin-bottom:2px;}

.empty{text-align:center;padding:70px 20px;color:var(--ink3);}
.empty .ic{width:56px;height:56px;border-radius:50%;background:var(--p-soft);color:var(--p);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;}
.empty h3{color:var(--ink);font-weight:800;margin:0 0 6px;font-size:16px;}
.empty p{font-size:13px;margin:0;}

.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:var(--r-pill);font-size:12.5px;font-weight:700;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;}
.toast.show{opacity:1;}
.sched-lang-row{display:flex;gap:9px;align-items:center;margin-bottom:8px;}
.sched-lang-row .lang-tag{width:30px;height:30px;flex-shrink:0;font-size:10px;font-weight:800;color:var(--p);background:var(--p-soft);border-radius:9px;display:flex;align-items:center;justify-content:center;letter-spacing:.02em;}
.sched-lang-row input{flex:1;padding:11px 14px;border:1.5px solid var(--line);background:var(--bg);border-radius:var(--r-sm);font-size:13.5px;font-family:inherit;color:var(--ink);outline:none;}
.sched-lang-row input:focus{border-color:var(--p);background:var(--surface);}
@media(max-width:600px){input,select,textarea{font-size:16px !important;}}
.notice-overlay{position:fixed;inset:0;background:rgba(20,15,35,.45);display:none;align-items:center;justify-content:center;z-index:70;padding:20px;}
.notice-overlay.show{display:flex;}
.notice-sheet{position:relative;background:var(--surface);width:100%;max-width:480px;border-radius:24px;max-height:80vh;overflow-y:auto;padding:20px 20px 20px;}
@media(min-width:540px){.notice-overlay{align-items:center;} .notice-sheet{border-radius:24px;max-height:75vh;}}
.notice-title{font-size:18px;font-weight:800;margin-bottom:8px;}
.notice-close{position:absolute;top:16px;right:16px;background:none;border:none;cursor:pointer;color:var(--ink3);display:flex;}
.notice-lang-row{display:flex;gap:6px;margin-bottom:14px;}
.notice-lang-row button{border:none;background:var(--bg);color:var(--ink2);border-radius:999px;padding:6px 13px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;}
.notice-lang-row button.active{background:var(--p);color:#fff;}
.notice-body{white-space:pre-wrap;font-size:14px;line-height:1.7;color:var(--ink2);}
</style>
</head>
<body>
<div class="app">
  <div class="topbar" id="topbar">
    <div class="topbar-row">
      <div class="logo"><span class="dot"></span>logbook.zip</div>
      <div style="display:flex;gap:8px;">
        <button class="icon-btn" id="noticeBtn" onclick="openNotice()" title="notice">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        </button>
        <button class="icon-btn" id="requestBtn" onclick="openRequest()" title="request">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><line x1="8" y1="10" x2="16" y2="10"/><line x1="8" y1="14" x2="13" y2="14"/></svg>
        </button>
        <button class="icon-btn" id="requestsAdminBtn" onclick="openRequestsAdmin()" title="requests inbox" style="display:none;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>
        </button>
        <button class="icon-btn" id="updateNoticeAdminBtn" onclick="openUpdateNoticeAdmin()" title="update notice" style="display:none;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l18-5v12L3 14v-3z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/></svg>
        </button>
        <button class="icon-btn" id="adminBtn" onclick="toggleAdmin()" title="admin">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l3 6 7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1z"/></svg>
        </button>
      </div>
    </div>
    <div class="search-shell">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="searchInput" type="text" placeholder="멤버 또는 스케줄로 검색…" oninput="localStorage.setItem('searchQuery',this.value);render()" onkeydown="if(event.key==='Enter'){event.preventDefault();render();}">
      <button class="go" onclick="render()" id="searchBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    </div>
    <div class="chip-row" id="langRow"></div>
    <div class="toggle-head" id="memberToggleHead" onclick="toggleFilterPanel('member')"><span id="memberToggleLabel">멤버 필터</span><span class="chev">▾</span></div>
    <div class="toggle-panel" id="memberPanel"><div class="chip-row wrap" id="memberRow" style="padding-top:6px;"></div></div>
    <div class="toggle-head" id="sortToggleHead" onclick="toggleFilterPanel('sort')"><span id="sortToggleLabel">정렬</span><span class="chev">▾</span></div>
    <div class="toggle-panel" id="sortPanel"><div class="chip-row wrap" id="sortRow" style="padding-top:6px;"></div></div>
  </div>
  <div class="content">
    <div class="add-card" id="addBoxCard">
      <div class="add-head" id="addHead" onclick="toggleAddBox()"><span class="plus">+</span><span id="addSummary">새 영상 등록하기</span></div>
      <div class="add-body" id="addBody">
        <div class="field">
          <label id="urlLabel">유튜브 링크</label>
          <input type="text" id="urlInput" placeholder="https://www.youtube.com/watch?v=..." onpaste="setTimeout(fetchTitleForDraft,50)" onblur="fetchTitleForDraft()" onkeydown="if(event.key==='Enter'){event.preventDefault();fetchTitleForDraft();}">
          <div class="field-hint" id="fetchStatus">링크를 입력하면 제목을 자동으로 가져와요.</div>
        </div>
        <div class="field"><label id="yearLabel">업로드 연도</label><input type="number" id="yearInput" placeholder="예: 2024" min="2000" max="2100"><div class="field-hint" id="yearHint">유튜브 자동 감지가 불가능한 경우 직접 입력해주세요.</div></div>
        <div class="field"><label id="titleLabel">제목 (언어별 입력 가능)</label><input type="text" id="titleInput_ko" placeholder="한국어"><input type="text" id="titleInput_en" placeholder="English"><input type="text" id="titleInput_zh" placeholder="中文"><input type="text" id="titleInput_ja" placeholder="日本語"><input type="text" id="titleInput_es" placeholder="Español"><input type="text" id="titleInput_pt" placeholder="Português"></div>
        <div class="field"><div class="picker-head"><label id="memberLabel">출연 멤버</label><button type="button" class="mini-btn" id="selectAllBtn" onclick="toggleSelectAllDraft()">전체선택</button></div><div class="pick-grid" id="draftMemberGrid"></div></div>
        <div class="field"><label id="pasteLabel">일괄 붙여넣기</label><textarea id="pasteDraftInput" rows="4" placeholder="형식대로 붙여넣고 적용을 눌러주세요" style="width:100%;padding:12px 14px;border:1.5px solid var(--line);background:var(--bg);border-radius:var(--r-sm);font-size:13px;font-family:inherit;color:var(--ink);outline:none;resize:vertical;"></textarea><div class="add-actions" style="justify-content:flex-start;margin-top:8px;"><button type="button" id="pasteDraftBtn" style="padding:9px 20px;border-radius:var(--r-pill);border:none;background:var(--p-soft);color:var(--p);font-size:12.5px;font-weight:800;font-family:inherit;cursor:pointer;" onclick="applyPasteDraft()">적용</button></div></div>

function applyPasteDraft(){const raw=document.getElementById('pasteDraftInput').value||'';const lines=raw.split(/\r?\n/);let section='',vals={};for(const line of lines){const x=line.trim();if(!x)continue;if(/^\d{4}$/.test(x)){document.getElementById('yearInput').value=x;continue;}if(/^스케줄$|^schedule$/i.test(x)){section='sched';continue;}if(/^숨겨진 검색어$|^hidden keywords$/i.test(x)){section='kw';continue;}const m=x.match(/^(한국어|영어|중국어|일본어|Español|Português|English|中文|日本語|한국|나라|country)\s*:\s*(.*)$/i);if(m){const map={'한국어':'ko','영어':'en','중국어':'zh','일본어':'ja','English':'en','中文':'zh','日本語':'ja','Español':'es','Português':'pt'};if(section==='sched'&&map[m[1]])vals[map[m[1]]]=m[2].trim();else if(section==='kw'&&m[2].trim())draftKw[map[m[1]]||lang].push(...m[2].split(/[,\n]+/).map(v=>v.trim()).filter(Boolean));continue;}if(section==='sched'&&x)vals[lang]=x;else if(section==='kw')draftKw[lang].push(...x.split(/[,]+/).map(v=>v.trim()).filter(Boolean));}if(Object.values(vals).some(Boolean))draftSched.push(vals);renderDraft();showToast(t('pasteDone'));}
function getTitle(v){return pickLang(v?.title)||v?.title||'';} function commonTitle(v){return getTitle(v);} function ytId(url){const m=(url||'').match(/(?:v=|youtu\.be\/|youtube\.com\/shorts\/)([\w-]{6,})/);return m?m[1]:null;}
async function fetchTitleForDraft(){const url=document.getElementById('urlInput').value.trim();if(!url||url===lastFetchedUrl)return;lastFetchedUrl=url;document.getElementById('fetchStatus').textContent=t('fetching');const id=ytId(url);if(!id){document.getElementById('fetchStatus').textContent=t('fetchFail');return;}try{const r=await fetch(`https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=${id}&format=json`);if(!r.ok)throw 0;const j=await r.json();LANG_CODES.forEach(l=>document.getElementById('titleInput_'+l).value=j.title||'');document.getElementById('fetchStatus').textContent=t('fetched');}catch(e){document.getElementById('fetchStatus').textContent=t('fetchFail');}}
async function addVideo(){if(!isAdmin)return;const url=document.getElementById('urlInput').value.trim(),id=ytId(url);if(!id){showToast(t('invalidUrl'));return;}const title=document.getElementById('titleInput_ko').value.trim()||document.getElementById('titleInput_en').value.trim()||document.getElementById('titleInput_zh').value.trim()||document.getElementById('titleInput_ja').value.trim()||document.getElementById('titleInput_es').value.trim()||document.getElementById('titleInput_pt').value.trim();const data={id:editingId||id,url,title,year:Number(document.getElementById('yearInput').value)||'',members:sortMembersDisplay(draftMembers),schedules:draftSched,keywords:draftKw,categories:draftCategories,countries:draftCountries,addedAt:editingId?(editDraft?.addedAt||Date.now()):Date.now()};try{document.getElementById('submitBtn').disabled=true;await setDoc(doc(videosCol,data.id),data);closeAddBox();clearDraft();showToast(t('submit'));}catch(e){showToast(t('saveFail',e.message));}finally{document.getElementById('submitBtn').disabled=false;}}
function closeAddBox(){document.getElementById('addBody').classList.remove('open');document.getElementById('addHead').classList.remove('open');clearDraft();}
function editVideo(id){const v=videos.find(x=>x.id===id);if(!v||!isAdmin)return;editingId=id;editDraft=v;draftMembers=[...(v.members||[])];draftSched=[...(v.schedules||[])];draftKw=normalizeKw(v.keywords);draftCategories=[...(v.categories||[])];draftCountries=[...(v.countries||[])];document.getElementById('urlInput').value=v.url||'';document.getElementById('yearInput').value=v.year||'';LANG_CODES.forEach(l=>document.getElementById('titleInput_'+l).value=commonTitle(v));renderDraft();document.getElementById('addBoxCard').style.display='block';document.getElementById('addBody').classList.add('open');document.getElementById('addHead').classList.add('open');window.scrollTo({top:0,behavior:'smooth'});}
async function deleteVideo(id){if(!isAdmin||!confirm(t('delConfirm')))return;try{await deleteDoc(doc(videosCol,id));showToast(t('del'));}catch(e){showToast(t('delFail',e.message));}}
function toggleMemberFilter(m){if(activeMembers.has(m))activeMembers.delete(m);else activeMembers.add(m);saveActiveMembers();renderMemberRow();render();}
function highlight(text,q){const s=text||'';if(!q)return s;const i=norm(s).indexOf(q);return i<0?s:s.slice(0,i)+'<mark>'+s.slice(i,i+q.length)+'</mark>'+s.slice(i+q.length);}
function videoMatches(v,q){if(!q)return true;const nq=norm(q);if(norm(commonTitle(v)).includes(nq)||norm(String(v.year||'')).includes(nq)||norm(v.url).includes(nq))return true;if((v.members||[]).some(m=>norm(m).includes(nq)||norm(MEMBER_FULLNAME[m]).includes(nq)||norm(mName(m)).includes(nq)))return true;if((v.schedules||[]).some(s=>LANG_CODES.some(l=>norm(typeof s==='string'?s:s?.[l]).includes(nq))))return true;if((v.keywords||[] instanceof Array?v.keywords:normalizeKw(v.keywords))){const k=normalizeKw(v.keywords);if(LANG_CODES.some(l=>k[l].some(x=>norm(x).includes(nq))))return true;}if((v.countries||[]).some(x=>countryMatchesQuery(x,nq)))return true;if((v.categories||[]).some(c=>norm(t('cats')[c]).includes(nq)||norm(c).includes(nq)))return true;return false;}
function render(){const el=document.getElementById('reelList');if(!videosLoaded){el.innerHTML=`<div class="empty"><h3>${LOADING_I18N[lang]}</h3></div>`;return;}const q=(document.getElementById('searchInput').value||'').trim();let list=videos.filter(v=>videoMatches(v,q));if(activeMembers.size)list=list.filter(v=>(v.members||[]).some(m=>activeMembers.has(m)));if(excludeAllMembers)list=list.filter(v=>(v.members||[]).length===0);list.sort((a,b)=>(sortOrder==='newest'?1:-1)*((b.addedAt||0)-(a.addedAt||0)));if(!list.length){el.innerHTML=`<div class="empty"><h3>${videos.length?t('emptyNoResultTitle'):t('emptyNoVideoTitle')}</h3><p>${videos.length?t('emptyNoResultDesc'):t('emptyNoVideoDesc')}</p></div>`;return;}el.innerHTML=list.map(renderCard).join('');}
function renderCard(v){const id=v.id||ytId(v.url)||Math.random().toString(36).slice(2),title=commonTitle(v)||t('noTitle')(id),thumb=ytId(v.url)?`https://i.ytimg.com/vi/${ytId(v.url)}/hqdefault.jpg`:'';const members=sortMembersDisplay(v.members||[]);const schedules=(v.schedules||[]).map(s=>schedLangText(s)).filter(Boolean);const cats=(v.categories||[]).map(c=>t('cats')[c]||c);return `<article class="card"><div class="thumb">${thumb?`<img loading="lazy" src="${thumb}" alt="">`:''}<a class="play" href="${v.url||'#'}" target="_blank" rel="noopener"><svg viewBox="0 0 48 48" fill="none"><circle cx="24" cy="24" r="20" fill="white" fill-opacity=".92"/><path d="M20 16.5v15l12-7.5-12-7.5z" fill="#1B1523"/></svg></a><div class="cats">${cats.map(c=>`<span class="cat-badge">${c}</span>`).join('')}</div></div><div class="card-body"><h2 class="card-title"><a href="${v.url||'#'}" target="_blank" rel="noopener">${highlight(title,norm((document.getElementById('searchInput').value||'')))}</a></h2><div class="card-meta">${v.year||''}</div><div class="sec"><div class="sec-label">${t('memberSection')}</div><div class="row-flex">${members.length?members.map(m=>`<span class="member-badge">${mName(m)}</span>`).join(''):`<span class="empty-txt">${t('noMemberOnCard')}</span>`}</div></div><div class="sec"><div class="sec-label">${t('schedSection')}</div><div class="row-flex">${schedules.length?schedules.map(s=>`<span class="sched-pill">${s}</span>`).join(''):`<span class="empty-txt">${t('noSchedOnCard')}</span>`}</div></div>${isAdmin?`<div class="card-actions"><button class="primary" onclick="editVideo('${id}')">${t('edit')}</button><button class="danger" onclick="deleteVideo('${id}')">${t('del')}</button></div>`:''}</div></article>`;}
function showToast(msg){const x=document.getElementById('toast');x.textContent=msg;x.classList.add('show');clearTimeout(showToast.t);showToast.t=setTimeout(()=>x.classList.remove('show'),1800);}
function openNotice(){document.getElementById('noticeOverlay').classList.add('show');}function closeNotice(){document.getElementById('noticeOverlay').classList.remove('show');}function openRequest(){document.getElementById('requestOverlay').classList.add('show');}function closeRequest(){document.getElementById('requestOverlay').classList.remove('show');}function openRequestsAdmin(){if(isAdmin)document.getElementById('requestsAdminOverlay').classList.add('show');}function closeRequestsAdmin(){document.getElementById('requestsAdminOverlay').classList.remove('show');}function openUpdateNoticeAdmin(){if(isAdmin)document.getElementById('updateNoticeAdminOverlay').classList.add('show');}function closeUpdateNoticeAdmin(){document.getElementById('updateNoticeAdminOverlay').classList.remove('show');}function openUpdateNotice(){document.getElementById('updateNoticeOverlay').classList.add('show');}function closeUpdateNotice(){document.getElementById('updateNoticeOverlay').classList.remove('show');}
async function toggleAdmin(){if(!location.search.includes('admin=1'))return;if(isAdmin){await signOut(auth);isAdmin=false;applyAdminVisibility();render();return;}try{await signInWithPopup(auth,new GoogleAuthProvider());}catch(e){showToast(e.message);}}
onAuthStateChanged(auth,user=>{isAdmin=isAdminUser(user);applyAdminVisibility();render();});
onSnapshot(videosCol,snap=>{videos=snap.docs.map(d=>({...d.data(),id:d.id})).sort((a,b)=>(b.addedAt||0)-(a.addedAt||0));videosLoaded=true;render();},e=>{videosLoaded=true;document.getElementById('reelList').innerHTML=`<div class="empty"><h3>${t('loadFail',e.message)}</h3></div>`;});
applyStaticText();const sq=localStorage.getItem('searchQuery')||'';document.getElementById('searchInput').value=sq;renderDraft();render();
Object.assign(window,{setSort,setLang,toggleMemberFilter,toggleExcludeAllMembers,toggleFilterPanel,toggleDraftCatPanel,toggleAddBox,toggleDraftMember, toggleSelectAllDraft,toggleDraftCat,addCountryToDraft,addKwToDraft,addSchedToDraft,applyPasteDraft,fetchTitleForDraft,addVideo,closeAddBox,editVideo,deleteVideo,openNotice,closeNotice,openRequest,closeRequest,openRequestsAdmin,closeRequestsAdmin,openUpdateNoticeAdmin,closeUpdateNoticeAdmin,openUpdateNotice,closeUpdateNotice,toggleAdmin});
</script>
